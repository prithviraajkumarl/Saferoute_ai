services:
  db:
    image: postgis/postgis:16-3.4
    container_name: saferoute-postgis
    environment:
      POSTGRES_DB: saferoute_db
      POSTGRES_USER: saferoute_user
      POSTGRES_PASSWORD: saferoute_secure_password_2026
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U saferoute_user -d saferoute_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: saferoute-redis
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: saferoute-backend
    environment:
      DATABASE_URL: postgresql+psycopg2://saferoute_user:saferoute_secure_password_2026@db:5432/saferoute_db
      REDIS_URL: redis://redis:6379/0
      ENVIRONMENT: production
      DEBUG: "false"
      SECRET_KEY: saferoute-super-secret-tactical-production-key-2026-secure
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: saferoute-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  pgdata:
  redisdata:
